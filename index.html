const fT=n=>'NT$'+Math.round(n).toLocaleString();
const fF=(n,t)=>(Math.round(n*100)/100).toLocaleString()+' '+t.fc;
function bal(t,list,val){const b={};t.members.forEach(m=>b[m]=0);list.forEach(e=>{const s=e.split.filter(m=>m in b);if(!s.length||!(e.payer in b))return;const v=val(e);b[e.payer]+=v;s.forEach(m=>b[m]-=v/s.length)});return b}
function simplify(b){const c=[],d=[];Object.entries(b).forEach(([n,v])=>{if(v>.5)c.push([n,v]);else if(v<-.5)d.push([n,-v])});c.sort((a,b)=>b[1]-a[1]);d.sort((a,b)=>b[1]-a[1]);const r=[];let i=0,j=0;
 while(i<c.length&&j<d.length){const a=Math.min(c[i][1],d[j][1]);r.push([d[j][0],c[i][0],a]);c[i][1]-=a;d[j][1]-=a;if(c[i][1]<.5)i++;if(d[j][1]<.5)j++}return r}
function block(title,b,fm){const tr=simplify(b);return`<div class="box"><h3>${title}</h3>${tr.length?tr.map(x=>`<div class="xfer"><span>${esc(mn(x[0]))}</span>➜<span>${esc(mn(x[1]))}</span><b>${fm(x[2])}</b></div>`).join(''):'<div class="sub">不需要轉帳</div>'}<hr style="border:0;border-top:1px dashed var(--line)">${Object.entries(b).map(([n,v])=>`<div class="row"><span>${esc(mn(n))}</span><b class="${v>=0?'pos':'neg'}" style="text-align:right">${v>=0?'應收 ':'應付 '}${fm(Math.abs(v))}</b></div>`).join('')}</div>`}
function vExp(t){const ex=LC().ex;let out;
 if(U.mode==='F')out=block(`全部換成${esc(t.fc)}`,bal(t,ex,e=>e.cur==='F'?e.amt:e.amt/rt(t)),n=>fF(n,t));
 else if(U.mode==='T')out=block('全部換成台幣',bal(t,ex,e=>e.cur==='T'?e.amt:e.amt*rt(t)),fT);
 else out=block('台幣部分（不換算）',bal(t,ex.filter(e=>e.cur==='T'),e=>e.amt),fT)+block(`${esc(t.fc)}部分（不換算）`,bal(t,ex.filter(e=>e.cur==='F'),e=>e.amt),n=>fF(n,t));
 const me0=L.acct&&t.members.includes(L.acct.id)?L.acct.id:t.members[0];
 return`<div class="swipe" onscroll="U.exp=this.scrollLeft>this.clientWidth/2?1:0;$('#dt').textContent=U.exp?'← 新增支出　● 最簡付錢方式':'● 新增支出　最簡付錢方式 →'">
 <section><div class="box"><h3>新增支出</h3><input id="ew" placeholder="項目（例：午餐）"><div style="height:8px"></div>
  <div class="row"><input id="ea" type="number" inputmode="decimal" placeholder="金額"><select id="ec"><option value="F">${esc(t.fc)}</option><option value="T">台幣</option></select></div><div style="height:8px"></div>
  <div class="row"><span class="fit sub">1 ${esc(t.fc)} =</span><input id="er" type="number" inputmode="decimal" step="any" value="${t.rate}"><span class="fit sub">台幣</span></div><div style="height:8px"></div>
  <div class="row"><span class="fit sub">誰先付</span><select id="ep">${t.members.map(m=>`<option value="${esc(m)}" ${m===me0?'selected':''}>${esc(mn(m))}</option>`).join('')}</select></div>
  <div class="sub" style="margin:8px 0 4px">誰要分攤（可只選 2、3 人）</div>
  <div class="row" style="flex-wrap:wrap">${t.members.map((m,i)=>`<label class="fit" style="display:flex;gap:4px;align-items:center"><input type="checkbox" class="es" value="${i}" checked style="width:auto">${esc(mn(m))}</label>`).join('')}</div>
  <div style="height:10px"></div><button class="pri" onclick="addExp()">儲存支出</button></div>
  <h3>流水帳</h3>${ex.length?ex.map((e,i)=>`<div class="ck"><span style="flex:1">${esc(e.what)}<br><small>${esc(mn(e.payer))} 先付・${e.split.map(s=>esc(mn(s))).join('、')} 分攤</small></span><b>${e.cur==='T'?fT(e.amt):fF(e.amt,t)}</b><button class="x" onclick="LC().ex.splice(${i},1);save();flush();R()">${ic('x',18)}</button></div>`).join(''):'<div class="empty">還沒有支出。</div>'}</section>
 <section><div class="days" style="padding:0 0 10px">${[['F','全外幣'],['T','全台幣'],['S','各付各的幣']].map(a=>`<button class="chip ${U.mode===a[0]?'on':''}" onclick="U.mode='${a[0]}';U.exp=1;R()">${a[1]}</button>`).join('')}</div>${out}</section></div><div class="dots" id="dt">${U.exp?'← 新增支出　● 最簡付錢方式':'● 新增支出　最簡付錢方式 →'}</div>`}
function addExp(){const t=T(),w=$('#ew').value.trim(),a=parseFloat($('#ea').value),r=parseFloat($('#er').value);const sp=[...document.querySelectorAll('.es:checked')].map(x=>t.members[+x.value]);

 <button class="ghost" onclick="ET().days[U.eday].items.push({st:'nav',k:'exact',tm:'09:00',name:'',url:'',note:''});touch(ET());R()">＋ 新增卡片</button>`:'<div class="empty">先新增一天。</div>'}</div>
 <div class="sub" style="text-align:right;padding-bottom:8px">更新於 ${new Date(t.upd.at).toLocaleString('zh-TW',{hour12:false})}・${esc(t.upd.by)}</div></div>`}
function openEdit(id){if(!navigator.onLine){alert('編輯需要網路連線');return}U.eid=id;U.eday=0;R()}
function setp(path,v){let o=ET();const p=path.split('.');for(let i=0;i<p.length-1;i++)o=o[p[i]];o[p[p.length-1]]=v;touch(ET())}
function addDay(){const t=ET(),l=t.days[t.days.length-1];let dt='';if(l&&l.date){const x=new Date(l.date);x.setDate(x.getDate()+1);dt=x.toISOString().slice(0,10)}t.days.push({date:dt,w:{k:'sun',t:'',n:''},items:[]});U.eday=t.days.length-1;touch(t);R()}
function addPrep(c){const v=$('#np-'+c).value.trim();if(v){ET().prep[c].push({t:v});touch(ET());R()}}
function addMember(){const v=$('#nmb').value.trim();if(v&&!ET().members.includes(v)){ET().members.push(v);touch(ET());R()}}
function imgUp(el,p){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const mx=p==='bg'?900:320,k=Math.min(1,mx/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);const id='i'+Date.now();IMG[id]=c.toDataURL('image/jpeg',.7);setp(p,id);R()};im.src=r.result};r.readAsDataURL(f)}
/* ---- 設定 ---- */
function vSet(){const a=L.acct;return hero(null,'設定')+`<div class="pad" style="padding-top:16px">
 <div class="box"><h3>帳號</h3>${a?`<div>${esc(a.name)} <small>（帳號 ${esc(a.id)}）</small></div><div style="height:8px"></div><button class="ghost" onclick="L.acct=null;save();R()">登出</button>`:`<input id="ai" placeholder="帳號"><div style="height:6px"></div><input id="an" placeholder="顯示名稱"><div style="height:8px"></div><button class="pri" onclick="login()">登入 / 創建</button><div class="sub" style="margin-top:6px">目前帳號只存在這支裝置。</div>`}</div>
 <div class="box"><h3>加行程（僅檢視）</h3><div class="row"><input id="tcd" placeholder="旅行碼" autocapitalize="characters"><button class="ghost fit" style="width:auto" onclick="joinTrip()">加入</button></div></div>
 <div class="box"><h3>分享</h3>${D.trips.map(t=>`<div style="margin-bottom:10px"><b>${esc(t.name)}</b><div class="sub">旅行碼 <span class="code">${esc(t.tc)}</span>${L.ecs[t.tc]&&t.ec?`　編輯碼 <span class="code">${esc(t.ec)}</span>`:''}</div></div>`).join('')||'<span class="sub">尚無</span>'}</div>
 <div class="box"><h3>快取</h3><button class="ghost" onclick="if(confirm('清除本機所有圖片？')){IMG={};save();R()}">清除本地圖片快取</button></div>
 <div class="box"><h3>清除本機資料</h3><div class="sub" style="margin-bottom:8px">清除這支手機上的所有資料：行程、記帳、憑證、帳號登入與圖片。雲端（Supabase）上的資料不會被刪除。</div><button class="ghost" style="color:var(--st);font-weight:700" onclick="wipeAll()">清除本機所有資料</button></div><div class="box"><h3>版本</h3><div class="row" style="margin-bottom:8px"><span class="sub">目前版本</span><b style="text-align:right">${esc(APP_V)}</b></div><button class="ghost" onclick="forceUpdate()">更新 app（不會清除你的資料）</button></div><div class="box"><h3>雲端連線</h3><div class="row" style="margin-bottom:8px"><span class="sub">狀態</span><b style="text-align:right" id="sync">…</b></div><button class="ghost" onclick="testCloud()">測試雲端連線</button><div style="height:8px"></div><button class="ghost" onclick="uploadTrips()">把本機行程上傳到雲端</button>${SYNCERR?`<div class="sub" style="margin-top:6px;color:var(--st)">最近錯誤：${esc(SYNCERR)}</div>`:''}<div class="sub" style="margin-top:6px">${DB?'已讀到 config.js 的 Supabase 設定。':'尚未設定：config.js 還是預設值，帳號與行程只會存在這支手機。'}</div></div></div>`}
function login(){const i=$('#ai').value.trim(),n=$('#an').value.trim();if(!i||!n){alert('請填帳號與顯示名稱');return}L.acct={id:i,name:n};save();R()}
async function joinTrip(){const c=$('#tcd').value.trim().toUpperCase();let t=D.trips.find(x=>x.tc===c);
 if(!t){const r=await fetchTrip(c);if(!r){alert(navigator.onLine?'找不到這個旅行碼（或尚未連上雲端）':'離線中，無法查詢新的旅行碼');return}t=Object.assign(r,{id:'t'+Date.now(),bg:''});D.trips.push(t)}
 L.cid=t.id;U.tab='trip';save();R()}
/* ---- Supabase（以 RPC 呼叫，資料表不對外開放） ---- */
const SBC=window.SUPABASE||{};
const sbOn=()=>!!(SBC.url&&SBC.key&&!/YOUR/i.test(SBC.url+SBC.key));
async function rpc(fn,args){const h={'apikey':SBC.key,'Content-Type':'application/json'};if(/^eyJ/.test(SBC.key))h.Authorization='Bearer '+SBC.key;
 const r=await fetch(SBC.url.replace(/\/$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',headers:h,body:JSON.stringify(args||{})});
 if(!r.ok)throw new Error(await r.text());const t=await r.text();return t?JSON.parse(t):null}
DB=sbOn()?{sb:1}:null;
async function fetchTrip(tc){if(!DB||!navigator.onLine)return null;try{const r=await rpc('get_trip',{p_tc:tc});if(!r||!r.data)return null;const d=r.data;d.v=r.v;d.upd={at:Date.parse(r.upd_at)||r.v,by:r.upd_by||''};return d}catch(e){return null}}
async function flush(){if(!DB||!navigator.onLine)return;try{
 for(const tc of Object.keys(L.out)){const t=D.trips.find(x=>x.tc===tc);if(!t||!L.ecs[tc]||!t.ec){delete L.out[tc];continue}
  let ok=await rpc('update_trip',{p_ec:t.ec,p_data:strip(t),p_v:t.v,p_by:me()});
  if(!ok)ok=await rpc('create_trip',{p_tc:t.tc,p_ec:t.ec,p_data:strip(t),p_by:me()});
  delete L.out[tc]}
 save();badge()}catch(e){SYNCERR=String(e.message||e).slice(0,200)}}
async function unlock(){if(!navigator.onLine){alert('編輯需要網路連線');return}const c=$('#ecd').value.trim().toUpperCase();let t=D.trips.find(x=>x.ec===c);
 if(!t&&DB){try{const r=await rpc('find_by_ec',{p_ec:c});if(r&&r.data){const d=r.data;d.v=r.v;t=D.trips.find(x=>x.tc===r.tc);if(!t){t=Object.assign(d,{id:'t'+Date.now(),bg:'',tc:r.tc});D.trips.push(t)}t.ec=c}}catch(e){}}
 if(!t){alert('找不到這個編輯碼');return}L.ecs[t.tc]=1;L.cid=t.id;U.eid=t.id;save();closeSheet();R()}
async function makeTrip(){const n=$('#nn').value.trim(),tc=$('#ntc').value.trim().toUpperCase(),ec=$('#nec').value.trim().toUpperCase();
 if(!n||!/^[A-Z0-9]{4,}$/.test(tc)||!/^[A-Z0-9]{4,}$/.test(ec)||tc===ec){alert('請填名稱，並設定兩組不同的英數字碼（至少 4 碼）');return}
 if(D.trips.some(x=>x.tc===tc||x.ec===ec)){alert('這組碼已被使用');return}
 if(DB&&!navigator.onLine){alert('建立行程需要網路連線');return}
 const t={id:'t'+Date.now(),tc,ec,name:n,bg:'',v:Date.now(),upd:{at:Date.now(),by:me()},members:L.acct?[L.acct.id]:['我'],fc:$('#nf').value.trim()||'外幣',rate:parseFloat($('#nr').value)||1,places:[],prep:{行李:[],門票:[]},days:[]};
 if(DB){try{const ok=await rpc('create_trip',{p_tc:tc,p_ec:ec,p_data:strip(t),p_by:me()});if(!ok){alert('這組碼已被使用');return}}catch(e){alert('無法連到 Supabase，請檢查 config.js 設定');return}}
 D.trips.push(t);L.ecs[tc]=1;L.cid=t.id;U.eid=t.id;save();closeSheet();R()}
async function pullExp(){const t=T();if(!DB||!navigator.onLine||!t)return;try{const rows=await rpc('get_expenses',{p_tc:t.tc});
 LC().rx=(rows||[]).filter(r=>!L.acct||r.acct!==L.acct.id).flatMap(r=>(r.data||[]).map(e=>({...e,from:r.acct,pe:false})));save();R()}catch(e){}}
async function upExp(){const t=T();if(!L.acct){alert('請先到設定登入帳號');return}if(!DB||!navigator.onLine){alert('目前無法連線雲端，連線後再上傳');return}
 const g=LC().ex.filter(e=>!e.pe);
 try{const ok=await rpc('upload_expenses',{p_tc:t.tc,p_acct:L.acct.id,p_data:g.map(e=>({what:e.what,amt:e.amt,cur:e.cur,rate:e.rate,payer:e.payer,split:e.split}))});
  if(!ok){alert('雲端找不到這趟旅行，請先由有編輯碼的人同步一次行程');return}
  g.forEach(e=>e.up=true);save();await pullExp();R()}catch(e){alert('上傳失敗，請稍後再試')}}
async function refresh(){const t=T();await flush();const r=await fetchTrip(t.tc);if(r&&r.v>(t.v||0)){mergeIn(t,r);save()}else if(!DB||!navigator.onLine)alert('目前無法連線雲端，顯示的是本機最新內容');await pullExp();R()}
async function doLogin(){const id=$('#ai').value.trim();if(!id)return;let a=L.accts.find(x=>x.id===id);
 if(!a&&DB&&navigator.onLine){try{const r=await rpc('get_account',{p_id:id});if(r)a={id:r.id,name:r.name}}catch(e){}}
 if(!a){alert('找不到這個帳號，請先創建帳號');return}
 if(!L.accts.some(x=>x.id===id))L.accts.push(a);L.acct=a;save();closeSheet();R()}
async function doCreate(){const id=$('#ci').value.trim(),name=$('#cn').value.trim();if(!id||!name){alert('請填帳號與顯示名稱');return}if(!okId(id)){alert('帳號只能用英數字與 . _ - @ + ~ :');return}
 if(L.accts.some(x=>x.id===id)){alert('這個帳號已存在');return}
 if(DB&&navigator.onLine){try{const ok=await rpc('create_account',{p_id:id,p_name:name});if(!ok){alert('這個帳號已被使用');return}}catch(e){alert('無法連到 Supabase，請檢查 config.js 設定');return}}
 const a={id,name};L.accts.push(a);L.acct=a;save();closeSheet();R();if(!DB)alert('提醒：尚未連接雲端，這個帳號只存在這支手機。')}

async function wipeAll(){
 if(!confirm('這會清除這支手機上的所有資料：行程、記帳、憑證、帳號登入與圖片。\n雲端（Supabase）上的資料不會被刪除。\n\n確定要清除嗎？'))return;
 if(!confirm('再確認一次：清除後無法復原。'))return;
 window.WIPING=true;
 try{localStorage.removeItem('trip_d3');localStorage.removeItem('trip_l3');localStorage.removeItem('trip_img3')}catch(e){}
 try{await vTx('readwrite',o=>o.clear())}catch(e){}
 try{indexedDB.deleteDatabase('trip_vault')}catch(e){}
 try{for(const k of await caches.keys())await caches.delete(k)}catch(e){}
 location.replace(location.pathname+'?r='+Date.now())}
let SYNCERR='';
async function syncTrips(){if(!DB||!navigator.onLine)return 0;let n=0;
 for(const t of D.trips){if(!L.ecs[t.tc]||!t.ec)continue;
  try{const r=await rpc('get_trip',{p_tc:t.tc});
   if(!r){const ok=await rpc('create_trip',{p_tc:t.tc,p_ec:t.ec,p_data:strip(t),p_by:me()});if(ok)n++;else SYNCERR='「'+t.name+'」的旅行碼或編輯碼已被其他行程使用，無法上傳'}
   else if((r.v||0)<(t.v||0)){await rpc('update_trip',{p_ec:t.ec,p_data:strip(t),p_v:t.v,p_by:me()});n++}}
  catch(e){SYNCERR=String(e.message||e).slice(0,200)}}
 return n}
async function uploadTrips(){if(!DB){alert('config.js 還沒設定，無法上傳。');return}if(!navigator.onLine){alert('目前離線');return}
 if(!D.trips.some(t=>L.ecs[t.tc]&&t.ec)){alert('這支手機上沒有你有編輯權的行程。請先到「編輯」新增行程或輸入編輯碼。');return}
 SYNCERR='';const n=await syncTrips();alert(SYNCERR?'上傳失敗：'+SYNCERR:(n?'完成：已上傳／更新 '+n+' 個行程':'雲端已是最新，沒有需要上傳的行程'));R()}
async function testCloud(){if(!DB){alert('config.js 還是預設值（或沒有載入）。請填入 Supabase 的網址與金鑰、重新上傳後，重新開啟 app。');return}
 if(!navigator.onLine){alert('目前離線');return}
 try{await rpc('get_account',{p_id:'__ping__'});alert('連線成功：Supabase 與資料庫函式都正常。')}catch(e){alert('連線失敗：'+String(e.message||e).slice(0,300))}}
async function syncAccts(){if(!DB||!navigator.onLine)return;for(const a of L.accts){try{await rpc('create_account',{p_id:a.id,p_name:a.name})}catch(e){}}}
const APP_V=(document.querySelector('meta[name=app-v]')||{}).content||'?';
async function forceUpdate(){try{const rs=await navigator.serviceWorker.getRegistrations();for(const r of rs)await r.unregister();for(const k of await caches.keys())await caches.delete(k)}catch(e){}location.replace(location.pathname+'?r='+Date.now())}
async function checkUpdate(){if(!navigator.onLine||!location.protocol.startsWith('http'))return;
 try{const t=await(await fetch(location.pathname+'?c='+Date.now(),{cache:'no-store'})).text();const m=t.match(/<meta name="app-v" content="([^"]+)">/);
  if(m&&m[1]!==APP_V&&!document.getElementById('upd')){const b=document.createElement('div');b.id='upd';b.style.cssText='position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:50;background:#3A2E21;color:#FAF4E4;border-radius:14px;padding:10px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 18px rgba(0,0,0,.3);max-width:456px;margin:0 auto';
   b.innerHTML='<span style="flex:1">有新版本</span><button style="background:#FAF4E4;color:#3A2E21;border-radius:10px;padding:6px 14px;font-weight:700" onclick="forceUpdate()">立即更新</button>';document.body.appendChild(b)}}catch(e){}}
checkUpdate();document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate()});
R();vInit();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
